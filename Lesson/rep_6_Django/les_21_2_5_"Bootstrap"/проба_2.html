<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заголовок страницы</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<h1 class="text-center">Заголовок</h1>
<div class="container text-center">
    <div class="row align-items-start">
    <div class="col-2"></div>
    <div class="col-8">
        <div class="row">
            <div class="col-12">
                <a class="btn btn-link" href="https://my.sky.pro">Личный кабинет</a>
            </div>
            <div class="col-12">
                <img src="https://cdn-icons-png.flaticon.com/128/5968/5968667.png" class="img-thumbnail rounded mx-auto d-block" alt="иконка">
            </div>
            <div class="col=12 img-thumbnail mt-3 bg-dark text-white p-3">
                <form>
                  <div class="mb-3">
                      <label for="exampleInputEmail1" class="form-label">Почта</label>
                      <input placeholder="email@examle.com" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text">Введите почту</div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Имя</label>
                    <input placeholder="Иван Иванов" type="text" class="form-control" id="exampleInputPassword1">
                  </div>

                  <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-2"></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
