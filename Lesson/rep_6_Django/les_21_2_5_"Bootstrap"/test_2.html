<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заголовок страницы</title>
  <link href="css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<h1 class="text-center">Заголовок</h1>
  <div class="row align-items-start">
    <div class="col-2">
    </div>
    <div class="col-8">
      <div class="row">
        <div class="col-12">
          <a class="btn btn-link" href="https://my.sky.pro">Личный кабинет</a>
        </div>
        <div class="col-12">
          <img src="https://c.pxhere.com/photos/c6/fe/pansy_flowers_purple_nature_spring_color-971178.jpg!d" class="img-thumbnail rounded mx-auto d-block" alt="...">
        </div>
        <div class="col-12 mt-5">
          <form>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Почта</label>
              <input placeholder="email@example.com" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
              <div id="emailHelp" class="form-text">Введите электронную почту.</div>
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Имя</label>
              <input placeholder="Иван Иванов" type="text" class="form-control" id="exampleInputPassword1">
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
          </form>
        </div>
        <div class="col-12 mt-3">
          <ul class="list-group list-group-flush">
            <li class="list-group-item">An item</li>
            <li class="list-group-item">A second item</li>
            <li class="list-group-item">A third item</li>
            <li class="list-group-item">A fourth item</li>
            <li class="list-group-item">And a fifth one</li>
          </ul>
        </div>
        <div class="col-12">
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">Handle</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
              </tr>
              <tr>
                <th scope="row">2</th>
                <td>Jacob</td>
                <td>Thornton</td>
                <td>@fat</td>
              </tr>
              <tr>
                <th scope="row">3</th>
                <td colspan="2">Larry the Bird</td>
                <td>@twitter</td>
              </tr>
            </tbody>

          </table>
        </div>
      </div>
    </div>
    <div class="col-2">
    </div>
  </div>
</body>
</html>
