<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
	<link href="css/bootstrap.min.css" rel="stylesheet" />
  </head>
<body>
<div class="row">
	<div class="col-2"></div>
	<div class="col-8">
		<div class="row mt-5">
			<div class="col-6">
				<div class="card text-bg-secondary">
  					<div class="card-body">
    				<h2>Контактные данные:</h2>
						<div class="row">
							<div class="col-6">
								Москва<br>
								Санкт-Петербург<br>
							</div>
							<div class="col-6">
								+7 777 777 7777<br>
				 				+7 888 888 8888<br>
							</div>
						</div>
  					</div>
				</div>
			</div>
			<div class="col-6">
				<div class="card text-bg-secondary">
  					<div class="card-body">
						<form>
							<h2 class="text-center">Оставьте заявку</h2>
							<div class="mb-3">
    							<input type="text" class="form-control text-center" placeholder="Имя">
  							</div>
							<div class="mb-3">
    							<input type="email" class="form-control text-center" placeholder="Email">
							</div>
  							<div class="mb-3">
  								<textarea class="form-control text-center" placeholder="Сообщение" rows="3"></textarea>
  							</div>
							<button type="submit" class="btn btn-primary w-100">Отправить</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="col-2"></div>
</div>
</body>
</html>
